[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
]


[tool.ruff]
target-version = "py312"
line-length = 79

exclude = [
    "migrations",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "I", "B", "SIM", "C90", "ARG", "T20", "TCH", "PERF", "RUF", "S", "G"]
ignore = [
    "E501", # Line length is configured via `line-length`
]

