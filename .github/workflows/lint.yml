name: Lint Backend Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: ruff-action
      uses: astral-sh/ruff-action@v4.1.0
      with:
        version: "latest"
        src: "./backend"
        config: "./backend/pyproject.toml"
