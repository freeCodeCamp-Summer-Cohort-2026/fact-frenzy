name: Ruff
on: [ push, pull_request ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./backend"
          version: "0.16.7"
          args: "check"

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./backend"
          version: "0.16.7"
          args: "format --check"