name: Ruff
on: [ push, pull_request ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ruff Check
        uses: astral-sh/ruff-action@v4.1.0
        with:
         args: check --output-format=github

      - name: Ruff Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
         args: format --check
