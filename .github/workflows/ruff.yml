name: Ruff
on: [ push, pull_request ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          working-directory: backend
          args: check .

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          working-directory: backend
          args: format --check .