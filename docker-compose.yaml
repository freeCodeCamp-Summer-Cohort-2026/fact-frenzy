services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-factfrenzy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-factfrenzy-dev-password}
      - POSTGRES_DB=${POSTGRES_DB:-factfrenzy}
    ports:
      - "5432:5432"
    volumes:
      - factfrenzy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factfrenzy} -d ${POSTGRES_DB:-factfrenzy}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  factfrenzy_pgdata: